<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Shipping — Satellite Map with Chat Routing</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <h1>World Map</h1>
    <p class="muted">Use the chat to ask for simple navigation tasks, e.g. "around Denmark by car" or "around Denmark walking". The map will follow roads or walking trails when possible.</p>

    <div id="controls"></div>

    <div class="row">
      <button id="satToggle" class="btn">Satellite</button>
      <button id="reset" class="btn outline">Reset</button>
    </div>

    <hr />

    <div id="chat">
      <div id="messages"></div>
      <div id="chat-input">
        <input id="chatText" placeholder="Ask: e.g. 'around Denmark by car'" />
        <button id="send">Send</button>
      </div>
    </div>

    <div id="diag" class="muted small"></div>
    <footer class="attribution muted small">Satellite: Esri World Imagery · Streets: OpenStreetMap</footer>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
