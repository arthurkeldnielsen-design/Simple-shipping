<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Shipping — Simple Pathfinding (Car)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <h1>World Map</h1>
    <p class="muted">Simple pathfinding: Car mode only (fastest on main roads). Click the map to set Start and End points; the route will be calculated automatically.</p>

    <div id="controls">
      <div class="pill-row" role="group" aria-label="Pathfinding preferences">
        <button id="pill-scenery" class="pill" aria-pressed="false">Scenery Pathfinder</button>
        <button id="pill-trails" class="pill" aria-pressed="false">Walking Trails</button>
        <button id="pill-outline" class="pill" aria-pressed="false">Outline Scenery</button>
      </div>

      <div class="scenery-checkbox" style="margin-top:8px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input id="scenery-detect" type="checkbox" />
          <span>Enable Scenery Detection</span>
        </label>
      </div>
    </div>

    <div class="row">
      <div class="mode">Mode: Car</div>
      <button id="reset" class="btn outline">Reset</button>
    </div>

    <div id="diag" class="muted small"></div>
    <footer class="attribution muted small">Satellite: Esri World Imagery · Routing: OSRM public demo (driving profile)</footer>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
