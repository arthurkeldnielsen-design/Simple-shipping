<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Shipping — Satellite Map (Esri)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <h1>Satellite Map (Free)</h1>
    <p>Showing free, stationary satellite imagery (Esri World Imagery). Click a continent or country to zoom in.</p>
    <div id="controls"></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="satToggle" class="button-item">Satellite</button>
      <button id="streetToggle" class="button-item">Street</button>
      <button id="reset" class="button-item" style="background:#fff;color:#222;border:1px solid #ccc">Reset View</button>
    </div>
    <hr />
    <p style="font-size:12px;color:#666;margin-top:8px;">Satellite tiles: Esri World Imagery (not live video). Street tiles: OpenStreetMap. Suitable for free demos.</p>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
